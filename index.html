<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#191919" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DEXLESS Nav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background: #191919;
      }
      body {
        background: #0a0b0d;
        min-height: 100dvh;
        min-height: 100%;
      }
      /*
        Desktop panel min-width must be CSS media-query based.
        JS min-width breaks Chrome DevTools device mode (page shrink-to-fit,
        iframe still sees a wide CSS viewport → desktop Rewards layout).
      */
      @media (min-width: 1024px) {
        .app-shell {
          min-width: 1280px;
          overflow-x: auto;
        }
      }
      button {
        font: inherit;
      }
      /* Hide scrollbars project-wide; scrolling still works */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar,
      *::before::-webkit-scrollbar,
      *::after::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
